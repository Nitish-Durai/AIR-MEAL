services:
  db:
    image: postgres:16-alpine
    container_name: airmeal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airmeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airmeal_secret}
      POSTGRES_DB: ${POSTGRES_DB:-airmeal}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airmeal} -d ${POSTGRES_DB:-airmeal}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
